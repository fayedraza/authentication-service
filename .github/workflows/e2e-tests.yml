name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd mcp_server
          pip install -e .[test]
          pip install httpx

      - name: Start Docker Compose services
        run: |
          cd auth_platform
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 20

      - name: Check service health
        run: |
          echo "Checking Auth Service..."
          curl -f http://localhost:8000/docs || exit 1
          echo "✓ Auth Service is up"

          echo "Checking MCP Server..."
          curl -f http://localhost:8001/health || exit 1
          echo "✓ MCP Server is up"

      - name: Run E2E tests
        run: |
          cd mcp_server
          pytest tests/e2e/test_e2e_ci.py -v -s --log-cli-level=INFO

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Available Containers ==="
          docker ps -a
          echo ""
          echo "=== MCP Server Logs ==="
          docker logs $(docker ps -aq --filter "name=mcp-server") || echo "MCP Server container not found"
          echo ""
          echo "=== Auth Service Logs ==="
          docker logs $(docker ps -aq --filter "name=auth-service") || echo "Auth Service container not found"

      - name: Stop Docker Compose services
        if: always()
        run: |
          cd auth_platform
          docker compose down -v
