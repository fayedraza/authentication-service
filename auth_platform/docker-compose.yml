version: "3.9"
services:
  auth-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - DEV_MODE=true
      - LOG_DIR=/app/logs
      - MCP_SERVER_URL=http://mcp-server:8001
      - MCP_PUSH_ENABLED=true
      - MCP_TIMEOUT_SECONDS=2.0
      - MCP_MAX_RETRIES=2
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ../mcp_server
      target: development
    ports:
      - "8001:8001"
    volumes:
      - ../mcp_server:/workspace/mcp_server
    environment:
      - MCP_PORT=8001
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./mcp.db
      - AUTH_SERVICE_URL=http://auth-service:8000
      - FRAUD_THRESHOLD=0.7
      - RULE_BASED_FALLBACK=true
      - BAML_ENABLED=${BAML_ENABLED}
      - BAML_API_KEY=${BAML_API_KEY}
      - ALERT_CONSOLIDATION_WINDOW_MINUTES=5
      - MAX_EVENTS_PER_ALERT=10

  # Test service for running unit tests
  mcp-server-tests:
    build:
      context: ../mcp_server
      target: test
    volumes:
      - ../mcp_server:/workspace/mcp_server
    environment:
      - PYTHONPATH=/workspace
    profiles:
      - test
    command: ["python", "-m", "pytest", "mcp_server/tests/unit/", "-v"]
