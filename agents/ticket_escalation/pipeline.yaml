
name: ticket-escalation-pipeline
version: 1.0
description: Automated ticket triage and escalation pipeline

# Event-driven execution (triggered via webhook or API)
trigger:
  type: event
  source: ticket_created

environment:
  - name: AUTH_SERVICE_URL
    value: "http://auth-service:8000"

tasks:
  - name: analyze-ticket
    type: baml-agent
    agent: TicketEscalation
    inputs:
      ticket: ${event.payload}
    outputs:
      - analysis

  - name: update-ticket-status
    type: data-sink
    depends_on: [analyze-ticket]
    config:
      sink_type: http_api
      endpoint: "${AUTH_SERVICE_URL}/support/tickets/${event.payload.id}"
      method: PATCH
    inputs:
      analysis: ${analyze-ticket.outputs.analysis}
    transformation: |
        yield {
            "priority": analysis.priority,
            "category": analysis.category,
            "escalated": analysis.escalate,
            "escalation_reason": analysis.escalation_reason
        }
